<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Crédito estudiantil UTVT. Garcia Adrian Gael Joshua.</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>UTVT.</h1>
    <h1>Sistema de Crédito Estudiantil.</h1>
    <form id="credit-form">
      <!--campo para registrar el nombre del Estudiante-->
      <label for="nombre">Nombre del Solicitante:</label>
      <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>

      <label for="monto">Monto del Crédito Solicitado ($):</label>
      <input type="number" id="monto" value="150000" required>
      
      <label for="tasa">Tasa de Interés Anual Ordinaria (%):</label>
      <input type="number" id="tasa" value="34" step="0.1" required>
      
      <label for="plazo">Plazo del Financiamiento (Meses):</label>
      <select id="plazo">
        <option value="12">12 meses</option>
        <option value="24">24 meses</option>
        <option value="36">36 meses</option>
        <option value="48" selected>48 meses</option>
      </select>

      <button type="button" id="btn-calcular">Calcular Amortización</button>
    </form>
  
    <!--saludo con el nombre del solicitante-->
    <p id="saludo"></p>

    <table id="tabla-amortizacion">
    <thead>
        <tr>
          <th>Mes</th>
          <th>Saldo Inicial</th>
          <th>Capital</th>
          <th>Interés</th>
          <th>IVA (16%)</th>
          <th>Pago Total</th>
          <th>Saldo Final</th>
        </tr>
      </thead>
      <tbody>

      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
